name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # revision.json records the crate version, so a tag that disagrees with
      # Cargo.toml would publish assets under URLs nothing resolves to.
      - name: Tag matches the crate version
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  build:
    name: ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Keep in step with TARGETS in src/revision.rs, which names the assets.
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # The runner checks out a detached HEAD, so hand build.rs the sha rather
      # than letting it guess from the working tree.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          SNAG_GIT_COMMIT: ${{ github.sha }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/snag.exe" "dist/snag-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/snag" "dist/snag-${{ matrix.target }}"
          fi

      - name: Smoke test the binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/snag"
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" --version
          "$BIN" check demo/suite.toml
          "$BIN" demo/suite.toml -t fast

      - uses: actions/upload-artifact@v4
        with:
          name: snag-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The build number is one past the previous release's, so "no previous
      # revision" must mean exactly that and never "the network hiccuped" —
      # that would silently restart the counter at 1. Resolving it through gh
      # rather than the anonymous URL makes an unreachable API fail the job.
      - name: Resolve the previous revision
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
            --json tagName --jq '.[0].tagName // ""')

          if [ -z "$latest" ]; then
            echo "no previous release; starting the build number at 1"
            echo "flag=--offline" >> "$GITHUB_OUTPUT"
          elif gh release download "$latest" --repo "$GITHUB_REPOSITORY" \
                 --pattern revision.json --dir previous; then
            echo "incrementing from $latest"
            echo "flag=--previous previous/revision.json" >> "$GITHUB_OUTPUT"
          else
            # The listing succeeded, so the API is up: this release simply
            # predates revision.json and has no build number to carry forward.
            echo "$latest has no revision.json; starting the build number at 1"
            echo "flag=--offline" >> "$GITHUB_OUTPUT"
          fi

      # Generated by the binary being released, so the version and commit it
      # reports are the ones actually shipped.
      - name: Generate revision.json
        run: |
          chmod +x dist/snag-x86_64-unknown-linux-gnu
          ./dist/snag-x86_64-unknown-linux-gnu revision \
            --output revision.json \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --repo "${GITHUB_REPOSITORY}" \
            ${{ steps.previous.outputs.flag }}
          cat revision.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/* revision.json
