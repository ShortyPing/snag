name: CI

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - 'documentation/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'documentation/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --check

      # Test code included, which is where lints usually appear first.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The suite is offline by design, so no network access is needed here.
      - name: Test
        run: cargo test
