name: CI

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - 'documentation/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'documentation/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      # Test code included, which is where lints usually appear first.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The suite is offline by design, so no network access is needed here.
      - name: Test
        run: cargo test
