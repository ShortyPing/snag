name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'documentation/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  build:
    name: ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Name the artifact after its target so the three uploads stay apart.
      - name: Stage binary
        shell: bash
        run: |
          mkdir dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/snag.exe" "dist/snag-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/snag" "dist/snag-${{ matrix.target }}"
          fi

      - name: Smoke test the binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/snag"
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" --version
          "$BIN" check demo/suite.toml
          "$BIN" demo/suite.toml -t fast

      - uses: actions/upload-artifact@v4
        with:
          name: snag-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
