name: Docs

on:
  push:
    branches:
      - main
    paths:
      - 'documentation/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'documentation/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: documentation/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: documentation
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: documentation
        run: pnpm typecheck

      # onBrokenLinks: 'throw', so this is the internal link checker too.
      - name: Build
        working-directory: documentation
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/build

  deploy:
    name: deploy to Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
